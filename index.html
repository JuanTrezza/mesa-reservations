<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MESA — Reservas</title>
    <meta
      name="description"
      content="Reservá tu mesa en MESA, restaurante de autor en Palermo, Buenos Aires. Elegí fecha, horario y ambiente en segundos y gestioná tus reservas online."
    />
    <meta name="theme-color" content="#0F0D0A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="MESA" />
    <meta property="og:title" content="MESA — Reservas" />
    <meta
      property="og:description"
      content="Restaurante de autor en Palermo, Buenos Aires. Reservá tu mesa online en segundos."
    />
    <meta property="og:url" content="https://juantrezza.github.io/mesa-reservations/" />
    <meta property="og:image" content="https://juantrezza.github.io/mesa-reservations/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Salón de MESA con luz cálida y el logo dorado" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Imagen LCP: se descubre antes de que React renderice el hero -->
    <link
      rel="preload"
      as="image"
      href="/src/assets/images/hero-768.webp"
      imagesrcset="/src/assets/images/hero-768.webp 768w, /src/assets/images/hero.webp 1536w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fuentes sin bloquear el render (display=swap evita texto invisible) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,500;1,600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,500;1,600&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
